services:
  clinichm-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=America/Argentina/Buenos_Aires  # Zona horaria para la API
    volumes:
      - ./logs:/app/logs
    depends_on:
      - database

  database:
    image: mysql:8.0.40
    command: --default-authentication-plugin=mysql_native_password --lower_case_table_names=1 --sql_mode=""
    container_name: production-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: clinichmdb
      MYSQL_USER: produser
      MYSQL_PASSWORD: prodpassword
      TZ: America/Argentina/Buenos_Aires  # Zona horaria para MySQL
    ports:
      - "3306:3306"
    restart: always
    volumes:
      - ./../data/mysql:/var/lib/mysql